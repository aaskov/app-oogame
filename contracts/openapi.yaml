openapi: 3.1.0
info:
  title: app-oogame
  version: 0.4.0
  description: |
    The contract between the backend and the frontend. Architect-owned.
    x-planned: true marks an operation that is not built yet. check:contracts
    allows a planned operation to be missing. The architect removes the flag
    when the operation is merged.
paths:
  /health:
    get:
      operationId: read_health
      summary: Report that the backend runs.
      responses:
        "200":
          description: The backend runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/register:
    post:
      operationId: register
      summary: Create a user. It does not log the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: A user with this email exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The email or the password is not valid.

  /auth/login:
    post:
      operationId: login
      summary: Log in. The response sets the httpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in. The Set-Cookie header holds the session JWT.
          headers:
            Set-Cookie:
              description: "session=<JWT>; HttpOnly; SameSite=Lax; Path=/"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: The email or the password is wrong. The response does not say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The body is not valid Credentials.

  /auth/logout:
    post:
      operationId: logout
      summary: Log out. The response clears the session cookie.
      responses:
        "204":
          description: Logged out. It also returns 204 without a session.

  /auth/me:
    get:
      operationId: read_me
      summary: Return the user of the session cookie.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /planets:
    get:
      operationId: list_planets
      summary: List the planets of the logged-in user.
      description: |
        If the user has no planets, the call first creates the home planet
        "Homeworld" with its vault: metal 500, crystal 500, deuterium 0
        (docs/adr/0109). The list is sorted by creation time, oldest first.
      responses:
        "200":
          description: The planets of the logged-in user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Planet"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /planets/{planet_id}/vault:
    parameters:
      - $ref: "#/components/parameters/PlanetId"
    get:
      operationId: read_vault
      summary: Return the vault of one planet of the logged-in user, with its production.
      description: |
        The amounts are calculated at calculated_at: the stored amounts plus the
        production since the last change (docs/adr/0111). A client can count up
        from calculated_at with production_per_hour.
      responses:
        "200":
          description: The vault of the planet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlanetNotFound"
        "422":
          description: The planet ID is not a UUID.

  /planets/{planet_id}/mines:
    parameters:
      - $ref: "#/components/parameters/PlanetId"
    get:
      operationId: list_mines
      summary: List the three mines of one planet of the logged-in user.
      description: |
        Always three mines, in the order metal_mine, crystal_mine,
        deuterium_synthesizer. A mine that was never upgraded has level 0.
      responses:
        "200":
          description: The mines of the planet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mine"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlanetNotFound"
        "422":
          description: The planet ID is not a UUID.

  /planets/{planet_id}/mines/{mine}/upgrade:
    parameters:
      - $ref: "#/components/parameters/PlanetId"
      - $ref: "#/components/parameters/MineKind"
    post:
      operationId: upgrade_mine
      summary: Upgrade one mine by one level. It costs resources from the vault.
      description: |
        The upgrade is instant. The server first adds the production up to now,
        then subtracts the cost and raises the level, in one transaction. Two
        upgrades at the same time cannot spend the same resources (docs/adr/0111).
      responses:
        "200":
          description: The mine after the upgrade, and the vault after the cost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineUpgrade"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlanetNotFound"
        "409":
          description: The vault has too little for the upgrade cost. Nothing changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The planet ID is not a UUID, or the mine is not one of the three kinds.

components:
  parameters:
    PlanetId:
      name: planet_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    MineKind:
      name: mine
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MineKind"

  responses:
    PlanetNotFound:
      description: |
        The planet does not exist, or it belongs to a different user. The
        response is the same in both cases, so it does not tell an attacker
        which planet IDs exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    Planet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 40

    Vault:
      type: object
      required: [planet_id, metal, crystal, deuterium, production_per_hour, calculated_at]
      properties:
        planet_id:
          type: string
          format: uuid
        metal:
          $ref: "#/components/schemas/Amount"
        crystal:
          $ref: "#/components/schemas/Amount"
        deuterium:
          $ref: "#/components/schemas/Amount"
        production_per_hour:
          $ref: "#/components/schemas/Resources"
        calculated_at:
          type: string
          format: date-time

    Resources:
      type: object
      required: [metal, crystal, deuterium]
      properties:
        metal:
          $ref: "#/components/schemas/Amount"
        crystal:
          $ref: "#/components/schemas/Amount"
        deuterium:
          $ref: "#/components/schemas/Amount"

    MineKind:
      type: string
      enum: [metal_mine, crystal_mine, deuterium_synthesizer]

    Mine:
      type: object
      required: [kind, level, production_per_hour, upgrade_cost]
      properties:
        kind:
          $ref: "#/components/schemas/MineKind"
        level:
          type: integer
          minimum: 0
        production_per_hour:
          description: What this mine adds per hour, at its level, without the base income.
          $ref: "#/components/schemas/Amount"
        upgrade_cost:
          description: The cost of the next level.
          $ref: "#/components/schemas/Resources"

    MineUpgrade:
      type: object
      required: [mine, vault]
      properties:
        mine:
          $ref: "#/components/schemas/Mine"
        vault:
          $ref: "#/components/schemas/Vault"

    Amount:
      description: |
        An amount of one resource. The maximum is the largest integer that
        JavaScript can hold without a loss of precision.
      type: integer
      minimum: 0
      maximum: 9007199254740991

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
