openapi: 3.1.0
info:
  title: app-oogame
  version: 0.9.1
  description: |
    The contract between the backend and the frontend. Architect-owned.
    x-planned: true marks an operation that is not built yet. check:contracts
    allows a planned operation to be missing. The architect removes the flag
    when the operation is merged.
paths:
  /health:
    get:
      operationId: read_health
      summary: Report that the backend runs.
      responses:
        "200":
          description: The backend runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/register:
    post:
      operationId: register
      summary: Create a user. It does not log the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: A user with this email exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The email or the password is not valid.

  /auth/login:
    post:
      operationId: login
      summary: Log in. The response sets the httpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in. The Set-Cookie header holds the session JWT.
          headers:
            Set-Cookie:
              description: "session=<JWT>; HttpOnly; SameSite=Lax; Path=/"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: The email or the password is wrong. The response does not say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The body is not valid Credentials.

  /auth/logout:
    post:
      operationId: logout
      summary: Log out. The response clears the session cookie.
      responses:
        "204":
          description: Logged out. It also returns 204 without a session.

  /auth/me:
    get:
      operationId: read_me
      summary: Return the user of the session cookie.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /planets:
    get:
      operationId: list_planets
      summary: List the planets of the logged-in user.
      description: |
        If the user has no planets, the call first creates the home planet
        "Homeworld" with its vault: metal 500, crystal 500, deuterium 0
        (docs/adr/0109). The list is sorted by creation time, oldest first.
      responses:
        "200":
          description: The planets of the logged-in user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Planet"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /planets/{planet_id}/vault:
    parameters:
      - $ref: "#/components/parameters/PlanetId"
    get:
      operationId: read_vault
      summary: Return the vault of one planet of the logged-in user, with its production.
      description: |
        The amounts are calculated at calculated_at: the stored amounts plus the
        production since the last change (docs/adr/0111). A client can count up
        from calculated_at with production_per_hour. The production includes the
        energy factor (docs/adr/0112).
      responses:
        "200":
          description: The vault of the planet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlanetNotFound"
        "422":
          description: The planet ID is not a UUID.

  /planets/{planet_id}/buildings:
    parameters:
      - $ref: "#/components/parameters/PlanetId"
    get:
      operationId: list_buildings
      summary: List the eight buildings of one planet of the logged-in user.
      description: |
        Always eight buildings, in the order metal_mine, crystal_mine,
        deuterium_synthesizer, solar_plant, metal_storage, crystal_storage,
        deuterium_tank, shipyard. A building that was never upgraded has
        level 0 (docs/adr/0112, docs/adr/0113, docs/adr/0115).
      responses:
        "200":
          description: The buildings of the planet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlanetNotFound"
        "422":
          description: The planet ID is not a UUID.

  /planets/{planet_id}/buildings/{kind}/upgrade:
    parameters:
      - $ref: "#/components/parameters/PlanetId"
      - $ref: "#/components/parameters/BuildingKind"
    post:
      operationId: upgrade_building
      summary: Start the upgrade of one building by one level. It costs resources from the vault.
      description: |
        The server first completes an upgrade that is due and adds the
        production up to now. Then it subtracts the cost and starts the
        upgrade, in one transaction. The level goes up at upgrade_finishes_at
        (docs/adr/0114). A planet has at most one running upgrade. Two upgrades
        at the same time cannot spend the same resources. An upgrade that
        makes the energy too low is allowed (docs/adr/0112).
      responses:
        "200":
          description: The building with its upgrade_finishes_at, and the vault after the cost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingUpgrade"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlanetNotFound"
        "409":
          description: The vault has too little for the upgrade cost, or an upgrade runs on the planet. Nothing changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The planet ID is not a UUID, or the kind is not one of the eight building kinds.

  /planets/{planet_id}/ships:
    parameters:
      - $ref: "#/components/parameters/PlanetId"
    get:
      operationId: read_shipyard
      summary: Show the ships and the running ship order of one planet of the logged-in user.
      description: |
        The server first completes the ships that are due (docs/adr/0115).
      responses:
        "200":
          description: The shipyard of the planet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipyard"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlanetNotFound"
        "422":
          description: The planet ID is not a UUID.

  /planets/{planet_id}/ships/{kind}/order:
    parameters:
      - $ref: "#/components/parameters/PlanetId"
      - $ref: "#/components/parameters/ShipKind"
    post:
      operationId: order_ships
      summary: Start an order of a number of ships of one kind. It costs resources from the vault.
      description: |
        The server first completes the ships that are due and adds the
        production up to now. Then it subtracts the cost of all the ships and
        starts the order, in one transaction. The ships are complete one by
        one (docs/adr/0115). A planet has at most one running ship order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipOrderRequest"
      responses:
        "200":
          description: The shipyard with the new order, and the vault after the cost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipOrderResult"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlanetNotFound"
        "409":
          description: The shipyard has level 0, a ship order runs on the planet, or the vault has too little for the cost. Nothing changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The planet ID is not a UUID, the kind is not a ship kind, or the count is not from 1 to 1000.

components:
  parameters:
    PlanetId:
      name: planet_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BuildingKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BuildingKind"

    ShipKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ShipKind"

  responses:
    PlanetNotFound:
      description: |
        The planet does not exist, or it belongs to a different user. The
        response is the same in both cases, so it does not tell an attacker
        which planet IDs exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    Planet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 40

    Vault:
      type: object
      required: [planet_id, metal, crystal, deuterium, production_per_hour, energy, capacity, calculated_at]
      properties:
        planet_id:
          type: string
          format: uuid
        metal:
          $ref: "#/components/schemas/Amount"
        crystal:
          $ref: "#/components/schemas/Amount"
        deuterium:
          $ref: "#/components/schemas/Amount"
        production_per_hour:
          $ref: "#/components/schemas/Resources"
        energy:
          description: The energy of the whole planet.
          $ref: "#/components/schemas/Energy"
        capacity:
          description: |
            The maximum of each resource. Production stops at the maximum. An
            amount above it stays, but does not grow (docs/adr/0113).
          $ref: "#/components/schemas/Resources"
        calculated_at:
          type: string
          format: date-time

    Resources:
      type: object
      required: [metal, crystal, deuterium]
      properties:
        metal:
          $ref: "#/components/schemas/Amount"
        crystal:
          $ref: "#/components/schemas/Amount"
        deuterium:
          $ref: "#/components/schemas/Amount"

    BuildingKind:
      type: string
      enum: [metal_mine, crystal_mine, deuterium_synthesizer, solar_plant, metal_storage, crystal_storage, deuterium_tank, shipyard]

    Energy:
      description: |
        Energy is not stored and does not count up. If used is more than
        produced, each mine produces only produced / used of its production
        (docs/adr/0112).
      type: object
      required: [produced, used]
      properties:
        produced:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0

    Building:
      type: object
      required: [kind, level, production_per_hour, energy, upgrade_cost]
      properties:
        kind:
          $ref: "#/components/schemas/BuildingKind"
        level:
          type: integer
          minimum: 0
        production_per_hour:
          description: |
            What this building adds per hour, at its level, after the energy
            factor and without the base income. 0 for the solar plant, the storage,
            and the shipyard.
          $ref: "#/components/schemas/Amount"
        energy:
          description: |
            What this building produces and uses, at its level. A mine has
            produced 0. The solar plant has used 0. The storage and the shipyard
            have 0 and 0.
          $ref: "#/components/schemas/Energy"
        upgrade_cost:
          description: The cost of the next level.
          $ref: "#/components/schemas/Resources"
        upgrade_finishes_at:
          description: |
            Only on the building with the running upgrade. At this time, the
            level goes up by one (docs/adr/0114).
          type: string
          format: date-time

    BuildingUpgrade:
      type: object
      required: [building, vault]
      properties:
        building:
          $ref: "#/components/schemas/Building"
        vault:
          $ref: "#/components/schemas/Vault"

    ShipKind:
      type: string
      enum: [small_cargo, light_fighter]

    Ship:
      type: object
      required: [kind, count, cost, build_seconds]
      properties:
        kind:
          $ref: "#/components/schemas/ShipKind"
        count:
          description: The complete ships of this kind on the planet.
          type: integer
          minimum: 0
        cost:
          description: The cost of one ship.
          $ref: "#/components/schemas/Resources"
        build_seconds:
          description: The build time of one ship, at the shipyard level of now.
          type: integer
          minimum: 1

    ShipOrder:
      type: object
      required: [kind, remaining, next_finishes_at, finishes_at]
      properties:
        kind:
          $ref: "#/components/schemas/ShipKind"
        remaining:
          description: The ships of the order that are not complete yet.
          type: integer
          minimum: 1
        next_finishes_at:
          description: At this time, the next ship is complete.
          type: string
          format: date-time
        finishes_at:
          description: At this time, the last ship of the order is complete.
          type: string
          format: date-time

    Shipyard:
      type: object
      required: [ships]
      properties:
        ships:
          description: Always two ships, in the order small_cargo, light_fighter.
          type: array
          items:
            $ref: "#/components/schemas/Ship"
        order:
          description: Only if a ship order runs on the planet.
          $ref: "#/components/schemas/ShipOrder"

    ShipOrderRequest:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 1000

    ShipOrderResult:
      type: object
      required: [shipyard, vault]
      properties:
        shipyard:
          $ref: "#/components/schemas/Shipyard"
        vault:
          $ref: "#/components/schemas/Vault"

    Amount:
      description: |
        An amount of one resource. The maximum is the largest integer that
        JavaScript can hold without a loss of precision.
      type: integer
      minimum: 0
      maximum: 9007199254740991

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
