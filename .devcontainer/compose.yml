# The devcontainer and its services (docs/adr/0103, 0106). Guarded (CODEOWNERS).
# Each clone gets its own compose project. Only dev publishes ports, on
# 127.0.0.1: fixed for the main checkout, random for an agent clone
# (.devcontainer/initialize.sh writes .env), so clones do not clash.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-0}:8000"
      - "127.0.0.1:${FRONTEND_HOST_PORT:-0}:3000"
    volumes:
      - ..:/workspace:cached
      # The agent bot key stays on the host (seed ADR 0005).
      - ${HOME}/.config/agent-bot:/mnt/agent-bot:ro
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      # Development only. A deployment sets its own secret (docs/adr/0105).
      JWT_SECRET: dev-only-secret-do-not-use-in-production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
